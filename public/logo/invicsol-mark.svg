<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 64" width="52" height="64" role="img" aria-label="INVICSOL">
  <!--
    Flat trace of the INVICSOL mark.

    The original supplied artwork is a 500x500 raster wrapped in an SVG tag, so
    it cannot scale, recolour or hold up at nav size. This is a hand-built
    vector of the same three ideas — pin, half sun, panel array — with the
    gloss, bevels, metallic gradient and drop shadow removed, because this
    design system has no gradients or shadows anywhere else.

    Detail is tuned for ~28px: seven rays and a three-row grid survive that
    size, finer panel divisions do not.
  -->
  <path
    d="M26 63.2C25.4 63.2 24.9 63 24.5 62.6 20.2 58.3 3.5 44.6 3.5 26.5 3.5 14.1 13.6 4 26 4S48.5 14.1 48.5 26.5C48.5 44.6 31.8 58.3 27.5 62.6 27.1 63 26.6 63.2 26 63.2Z"
    fill="#e8a020"
  />
  <path
    d="M26 58.6C21.6 54.1 8 42.2 8 26.5 8 16.6 16.1 8.5 26 8.5S44 16.6 44 26.5C44 42.2 30.4 54.1 26 58.6Z"
    fill="#0d1e3d"
  />

  <!-- Half sun -->
  <path d="M18.4 26.2A7.6 7.6 0 0 1 33.6 26.2Z" fill="#e8a020" />
  <g stroke="#e8a020" stroke-width="1.7" stroke-linecap="round">
    <path d="M26 12.6V16.4" />
    <path d="M18.6 14.6 20.5 17.9" />
    <path d="M33.4 14.6 31.5 17.9" />
    <path d="M13.2 20 16.5 21.9" />
    <path d="M38.8 20 35.5 21.9" />
    <path d="M11.2 26.2H15" />
    <path d="M40.8 26.2H37" />
  </g>

  <!-- Panel array: two planes meeting at a centre ridge -->
  <g stroke="#e8a020" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M9 32.4 26 29.6 43 32.4 26 52.6Z" />
    <path d="M26 29.6V52.6" />
    <path d="M11.6 39.2 26 36.8 40.4 39.2" />
    <path d="M15.6 45.4 26 43.8 36.4 45.4" />
  </g>
</svg>
