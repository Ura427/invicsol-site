<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 64" width="52" height="64" role="img" aria-label="INVICSOL">
  <!--
    Small-size variant of the mark, for anything under ~40px (nav, favicon).

    The detailed mark keeps seven rays and a three-row panel grid; below about
    40px those lines merge into a smudge, so this version drops to five rays and
    a single grid line, thickens the strokes, and fills the panel array solid so
    it survives as a shape rather than a set of hairlines. Same silhouette, so
    the two read as one logo at their respective sizes.
  -->
  <path
    d="M26 63.2C25.4 63.2 24.9 63 24.5 62.6 20.2 58.3 3.5 44.6 3.5 26.5 3.5 14.1 13.6 4 26 4S48.5 14.1 48.5 26.5C48.5 44.6 31.8 58.3 27.5 62.6 27.1 63 26.6 63.2 26 63.2Z"
    fill="#e8a020"
  />
  <path
    d="M26 57.4C21.4 52.6 9 41.4 9 26.5 9 17.1 16.6 9.5 26 9.5S43 17.1 43 26.5C43 41.4 30.6 52.6 26 57.4Z"
    fill="#0d1e3d"
  />

  <!-- Half sun: solid disc plus five short rays -->
  <path d="M18.8 27.4A7.2 7.2 0 0 1 33.2 27.4Z" fill="#e8a020" />
  <g stroke="#e8a020" stroke-width="2.6" stroke-linecap="round">
    <path d="M26 15.4V18.6" />
    <path d="M17.6 18.4 19.4 21" />
    <path d="M34.4 18.4 32.6 21" />
    <path d="M13.6 25.6H16.6" />
    <path d="M38.4 25.6H35.4" />
  </g>

  <!-- Panel array as a solid chevron, split by a navy ridge and one grid line -->
  <path d="M11 32.6 26 30.2 41 32.6 26 50.6Z" fill="#e8a020" />
  <g stroke="#0d1e3d" stroke-width="2.2" stroke-linecap="round">
    <path d="M26 31V49.4" />
    <path d="M13.6 38.6 26 36.8 38.4 38.6" />
  </g>
</svg>
