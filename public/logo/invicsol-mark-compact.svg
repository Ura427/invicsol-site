<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 64" width="52" height="64" role="img" aria-label="INVICSOL">
  <!--
    Small-size variant, for anything under ~40px (nav, favicon).

    The detailed mark carries nine rays and a six-line panel grid; below about
    40px those merge into a smudge. This drops to five rays and one grid line
    per plane and thickens everything, but deliberately keeps the inverse fill —
    left plane solid, right plane open — because that light-across-the-array
    asymmetry is what makes the mark recognisable at a glance, and it survives
    shrinking far better than the grid does.
  -->
  <path
    d="M26 63.2C25.4 63.2 24.9 63 24.5 62.6 20.2 58.3 3.5 44.6 3.5 26.5 3.5 14.1 13.6 4 26 4S48.5 14.1 48.5 26.5C48.5 44.6 31.8 58.3 27.5 62.6 27.1 63 26.6 63.2 26 63.2Z"
    fill="#f0a92a"
  />
  <path
    d="M26 58.6C21.6 54.2 7.8 42.2 7.8 26.5 7.8 16.5 15.9 8.4 26 8.4S44.2 16.5 44.2 26.5C44.2 42.2 30.4 54.2 26 58.6Z"
    fill="#15263f"
  />

  <!-- Sun: solid half disc plus five short rays -->
  <path d="M18.6 27.6A7.4 7.4 0 0 1 33.4 27.6Z" fill="#f0a92a" />
  <g stroke="#f0a92a" stroke-width="2.4" stroke-linecap="round">
    <path d="M26 15.6V18.4" />
    <path d="M17.9 18.6 19.6 21" />
    <path d="M34.1 18.6 32.4 21" />
    <path d="M14.2 25.6H16.8" />
    <path d="M37.8 25.6H35.2" />
  </g>

  <!-- Left plane solid, right plane open — the asymmetry is the signature -->
  <path d="M9.4 31.4 24.7 28.2V53.8C17.6 48.4 11.6 40.6 9.4 31.4Z" fill="#f0a92a" />
  <path
    d="M27.3 28.2 42.6 31.4C40.4 40.6 34.4 48.4 27.3 53.8Z"
    fill="none"
    stroke="#f0a92a"
    stroke-width="2"
    stroke-linejoin="round"
  />
  <g stroke="#f0a92a" stroke-width="2" stroke-linecap="round">
    <path d="M28.2 36.4 41 38.6" />
  </g>
  <g stroke="#15263f" stroke-width="2" stroke-linecap="round">
    <path d="M11.2 37 24.2 34.8" />
  </g>
  <path d="M24.9 28.4V54" stroke="#f0a92a" stroke-width="1.9" stroke-linecap="round" />
  <path d="M27.1 28.4V54" stroke="#f0a92a" stroke-width="1.9" stroke-linecap="round" />
</svg>
